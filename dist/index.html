<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f0e8">
  <meta name="description" content="One date. A fresh perspective every day. Your IELTS exam countdown for 28 November 2026, UTC+7.">
  <title>IELTS · The countdown</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header><a href="./" aria-label="IELTS countdown home">IELTS<span class="brand-dot">●</span></a><span class="header-note">ONE DAY CLOSER</span></header>
  <main>
    <div class="orbit" aria-hidden="true"><div class="orbit-inner"></div><span class="orbit-dot"></span></div>
    <section aria-labelledby="heading">
      <p class="eyebrow"><span class="live-dot"></span> THE NEXT CHAPTER</p>
      <h1 id="heading">Your IELTS exam<br>starts in<span class="accent">.</span></h1>
      <div class="countdown" role="timer" aria-label="Time until your IELTS exam">
        <div class="unit"><span id="days">00</span><span class="label">DAYS</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="unit"><span id="hours">00</span><span class="label">HOURS</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="unit"><span id="minutes">00</span><span class="label">MINUTES</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="unit"><span id="seconds">00</span><span class="label">SECONDS</span></div>
      </div>
      <p id="exam-message" role="status" hidden>Exam day is here.</p>
      <div class="exam-date"><span aria-hidden="true">↗</span><time datetime="2026-11-28T00:00:00+07:00">28 November 2026</time><span class="date-divider">/</span><span>UTC+7</span></div>
    </section>
  </main>
  <footer><span>A NEW LOOK. EVERY DAY.</span><span class="theme-caption"><span class="theme-swatch"></span><span id="theme-name"></span></span></footer>
</body>
</html>
